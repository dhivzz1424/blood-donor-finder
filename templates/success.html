
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Successful | BloodConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <nav class="navbar">
        <div class="logo">🩸 BloodConnect</div>
        <div class="nav-links">
            <a href="/">Home</a>
        </div>
    </nav>

    <section class="success-section">
        <div class="success-card">
            <div class="success-icon">✓</div>

            <h1>Registration Form Received!</h1>

            <p>Hello, {{ name }}!</p>
            <p>You registered successfully.</p>
            <p>Blood Group: <strong>{{ blood_group }}</strong></p>
            <p>Location: <strong>{{ location }}</strong></p>

            <a href="/" class="primary-btn">Back to Home</a>
        </div>
    </section>
</body>
</html>
