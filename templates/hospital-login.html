
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Hospital Login | BloodConnect</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav class="navbar">
        <a href="/" class="logo">🩸 BloodConnect</a>

        <a href="{{ url_for('hospital_register') }}"
           class="login-btn">
            Register Hospital
        </a>
    </nav>

    <section class="success-section">

        <div class="success-card">

            <div style="font-size: 45px;">🏥</div>

            <h1>Hospital Login</h1>

            <p>Access your BloodConnect hospital account.</p>

            {% if error %}
                <p style="color: red;">{{ error }}</p>
            {% endif %}

            <form action="{{ url_for('hospital_login') }}"
                  method="POST">

                <label for="email">Hospital Email</label>

                <input type="email"
                       id="email"
                       name="email"
                       placeholder="Enter hospital email"
                       required>

                <label for="password">Password</label>

                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter password"
                       required>

                <button type="submit">
                    Login as Hospital
                </button>

            </form>

            <p style="margin-top: 20px;">
                Don't have an account?
                <a href="{{ url_for('hospital_register') }}">
                    Register here
                </a>
            </p>

        </div>

    </section>

</body>
</html>
