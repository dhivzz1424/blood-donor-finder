
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Registration | BloodConnect</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="logo">🩸 BloodConnect</a>
        <a href="/hospital/login" class="login-btn">Hospital Login</a>
    </nav>

    <section class="success-section register-section">
        <div class="success-card register-card">
            <h1>Hospital Registration</h1>
            <p class="register-description">
                Create an account for your hospital.
            </p>

            {% if error %}
                <p style="color: red;">{{ error }}</p>
            {% endif %}

            <form action="{{ url_for('hospital_register') }}"
                  method="POST">

                <div class="register-form-grid">
                    <div class="form-group">
                        <label for="name">Hospital Name</label>
                        <input type="text" id="name" name="name"
                               placeholder="Hospital name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Official Email</label>
                        <input type="email" id="email" name="email"
                               placeholder="Hospital email" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Contact Number</label>
                        <input type="tel" id="phone" name="phone"
                               placeholder="Contact number" required>
                    </div>

                    <div class="form-group">
                        <label for="location">Location</label>
                        <input type="text" id="location" name="location"
                               placeholder="City or area" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password"
                               minlength="8" placeholder="Create password"
                               required>
                    </div>
                </div>

                <button type="submit" class="register-submit">
                    Register Hospital
                </button>
            </form>

            <p class="register-login">
                Already registered?
                <a href="{{ url_for('hospital_login') }}">Login here</a>
            </p>
        </div>
    </section>
</body>
</html>
